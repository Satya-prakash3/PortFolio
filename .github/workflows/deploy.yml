
name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check branch and commit
        run: |
          echo "Branch:"
          git branch --show-current
          echo "Commit:"
          git rev-parse HEAD

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Verify production build
        run: |
          echo "Checking dist directory..."
          ls -la dist
          ls -la dist/assets

          echo "Checking production HTML..."
          cat dist/index.html

          if grep -q '/src/main.jsx' dist/index.html; then
            echo "ERROR: Development entry point found in production HTML!"
            exit 1
          fi

          if ! grep -q '/PortFolio/assets/' dist/index.html; then
            echo "ERROR: Expected production asset path not found!"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
